[workspace]
members = ["klamottenkiste", "vendor/nested-wayland-session"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "LGPL-3.0-or-later"
repository = "https://github.com/ThePixelPilgrim/klamottenkiste"

[workspace.dependencies]
# v4_18: the widget needs `ContentFit` (4.8+) and the demo targets the 4.20 system GTK.
# kabelsalat got this transitively via vte4's `gtk_v4_18`; here it must be explicit.
gtk = { package = "gtk4", version = "0.11", features = ["v4_18"] }
libadwaita = { version = "0.9.2", features = ["v1_5"] }
anyhow = "1"
crossbeam-channel = "0.5"
tracing = "0.1"
