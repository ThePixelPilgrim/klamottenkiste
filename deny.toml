# cargo-deny configuration. Run `cargo deny check` before a release.
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false

[advisories]
db-path = "$CARGO_HOME/advisory-dbs"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = [
    # cgmath is unmaintained; pulled in via smithay in vendor/nested-wayland-session.
    # No fix on our side until smithay drops it.
    "RUSTSEC-2026-0196",
]

[licenses]
# LGPL-3.0-or-later workspace; permissive deps plus the LGPL GTK stack.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "0BSD",
    "Zlib",
    "Unlicense",
    "Unicode-3.0",
    "LGPL-2.1-or-later",
    "LGPL-3.0-or-later",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
