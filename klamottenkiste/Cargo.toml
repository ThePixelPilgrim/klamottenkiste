[package]
name = "klamottenkiste"
version = "0.1.0"
description = "Embed a Wayland application inside a GTK4 widget, via a nested Smithay compositor"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
nested-wayland-session = { path = "../vendor/nested-wayland-session", package = "monochromatic-nested-wayland-session" }
gtk.workspace = true
anyhow.workspace = true
crossbeam-channel.workspace = true
tracing.workspace = true

[dev-dependencies]
libadwaita.workspace = true

# Single-pane demo: one WaylandPane filling an adw::ApplicationWindow.
[[example]]
name = "demo"
path = "examples/demo.rs"

# Three WaylandPanes side by side in one window, each with a HIDE/SHOW toggle that
# preserves the hosted client (the state-preservation contract made visible).
[[example]]
name = "multi"
path = "examples/multi.rs"

# Headless multi-instance gate: proves N=3 nested-compositor instances coexist in
# ONE process, each hosting its own isolated Wayland client, with NO GTK window.
# Run: cargo run --example multi_headless
[[example]]
name = "multi_headless"
path = "examples/multi_headless.rs"

# Headless GTK-import proof for the zero-copy dmabuf present path: gtk::init (no window),
# import the compositor's exported dmabuf via GdkDmabufTextureBuilder, download its pixels,
# and confirm they match foot's rendered content. Run: cargo run --example dmabuf_import_check
[[example]]
name = "dmabuf_import_check"
path = "examples/dmabuf_import_check.rs"
